<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 페이지</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
  </head>
  <body>
    <main class="">
      <h1 class="logo">
        <a href="/" alt="판다마켓">
          <img src="/images/logo/logo.svg" alt="판다마켓"
        /></a>
      </h1>
      <section class="wrap">
        <div class="inner">
          <!-- 이메일/비밀번호 입력 영역 -->
          <form class="login-area">
            <div class="email-wrap">
              <p class="title">이메일</p>
              <input
                type="text"
                name=""
                id="email"
                placeholder="아이디 또는 이메일"
              />
            </div>
            <div class="password-wrap">
              <p class="title">비밀번호</p>
              <input
                type="password"
                name=""
                id="password"
                placeholder="비밀번호"
              />
            </div>
            <button type="submit" class="btn">로그인</button>
          </form>
          <!-- 간편 로그인 영역 -->
          <div class="short-cut">
            <p>간편 로그인하기</p>
            <ul class="sns-list">
              <!-- 구글 -->
              <li class="sns">
                <a href="" target="_blank">
                  <img src="/images/icon/ic_google.svg" alt="구글" />
                </a>
              </li>
              <!-- 카카오 -->
              <li class="sns">
                <a href="" target="_blank">
                  <img src="/images/icon/ic_kakao.svg" alt="카카오" />
                </a>
              </li>
            </ul>
          </div>
          <!-- 회원가입 영역 -->
          <div class="sign-up">
            <p>판다마켓이 처음이신가요? <a href="/signup.html">회원가입</a></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
