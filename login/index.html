<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다 마켓</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reset-css/reset.css"
    />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <script src="/js/script.js" defer></script>
  </head>
  <body>
    <div class="auth-container">
      <header>
        <h1>
          <a href="/" class="header__logo">
            <img src="/img/logo.svg" alt="판다마켓" />
          </a>
        </h1>
      </header>
      <section>
        <div class="auth-form__container">
          <form action="/items/" class="auth-form">
            <div class="auth-form__field" data-field="email">
              <label for="email" class="auth-form__label">이메일</label>
              <input
                type="email"
                name="email"
                id="email"
                class="auth-form__input"
                placeholder="이메일을 입력해주세요"
              />
              <p class="auth-form__error-message"></p>
            </div>
            <div class="auth-form__field" data-field="password">
              <label for="password" class="auth-form__label">비밀번호</label>
              <div class="auth-form__password">
                <input
                  type="password"
                  name="password"
                  id="password"
                  class="auth-form__input"
                  placeholder="비밀번호를 입력해주세요"
                />
                <button
                  type="button"
                  class="auth-form__btn-visibility"
                ></button>
              </div>
              <p class="auth-form__error-message"></p>
            </div>
            <button type="submit" class="auth-form__submit-btn">로그인</button>
          </form>
        </div>
      </section>
      <section>
        <div class="auth-simple-login">
          <p class="auth-simple-login__text">간편 로그인하기</p>
          <ul class="auth-simple-login__list">
            <li class="auth-simple-login__item">
              <a
                href="https://www.google.com/"
                target="_blank"
                class="auth-simple-login__link"
              >
                <img src="/img/ic_google.png" alt="Google" />
              </a>
            </li>
            <li class="auth-simple-login__item">
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                class="auth-simple-login__link"
              >
                <img src="/img/ic_kakaotalk.png" alt="KakaoTalk" />
              </a>
            </li>
          </ul>
        </div>
        <p class="auth-extra">
          판다마켓이 처음이신가요?
          <a href="/signup/" class="auth-extra__link">회원가입</a>
        </p>
      </section>
    </div>
  </body>
</html>
