<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>    
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header">
        <h2 class="logo"><a href="/" ><em class="logoImg"><img src="./images/logo_ico.png"></em><span>판다마켓</span></a></h2>
        <a class="login_btn" href="./login.html">로그인</a>
    </div>
    <div class="bannerArea">
        <div class="banner_box">
            <div class="leftBox">
                <p class="txt">일상의 모든 물건을<br/>거래해 보세요</p>
                <a class="items_btn" href="./items.html">구경하러 가기</a>
            </div>
            <div class="bgImg"><img src="./images/Img_home_top.png"></div>
        </div>
    </div>
    <div class="container">
        <div class="contlist">
            <div class="contArea">
                <div class="contBox lbox">
                    <div class="inbox imgbox">
                        <img src="./images/contimg1.png"/>
                    </div>
                    <div class="inbox txtbox">
                        <span class="box_title">Hot item</span>
                        <h6 class="intro">인기 상품을<br/>확인해 보세요</h6>
                        <p>가장 HOT한 중고거래 물품을<br/>판다 마켓에서 확인해 보세요</p>
                    </div>
                </div>
            </div>
            <div class="contArea">
                <div class="contBox rbox">
                    <div class="inbox txtbox">
                        <span class="box_title">Search</span>
                        <h6 class="intro">구매를 원하는<br/>상품을 검색하세요</h6>
                        <p>구매하고 싶은 물품은 검색해서<br/>쉽게 찾아보세요</p>
                    </div>
                    <div class="inbox imgbox">
                        <img src="./images/contimg2.png"/>
                    </div>
                </div>
            </div>
            <div class="contArea">
                <div class="contBox lbox">
                    <div class="inbox imgbox">
                        <img src="./images/contimg1.png"/>
                    </div>
                    <div class="inbox txtbox">
                        <span class="box_title">Register</span>
                        <h6 class="intro">판매를 원하는 <br/>상품을 등록하세요</h6>
                        <p>어떤 물건이든 판매하고 싶은 상품을 <br/>쉽게 등록하세요</p>
                    </div>
                </div>      
            </div>
        </div>
    </div>
    <div class="bannerArea last">
        <div class="banner_box">
            <div class="leftBox">
                <p class="txt">믿을 수 있는<br/>판다마켓 중고 거래</p>
            </div>
            <div class="bgImg"><img src="./images/Img_home_bottom.png"></div>
        </div>
    </div>
    <div id="footer">
        <div class="copyright">©codeit - 2024</div>
        <div class="center_nav">
            <span><a href="./privacy.html">Privacy Policy</a></span>
            <span><a href="./faq.html">FAQ</a></span>
        </div>
        <div class="sns_list">
            <a target="_blank" href="https://www.facebook.com/?locale=ko_KR"><img src="./images/ic_facebook.png"></a>
            <a target="_blank" href="https://x.com/?lang=ko"><img src="./images/ic_twitter.png"></a>
            <a target="_blank" href="https://www.youtube.com/"><img src="./images/ic_youtube.png"></a>
            <a target="_blank" href="https://www.instagram.com/"><img src="./images/ic_instagram.png"></a>
        </div>
    </div>
</body>
</html>
