<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="./images/favicon.svg" />
    <meta name="description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:image" content="./images/meta_img.svg" />
    <meta
      property="og:url"
      content="https://fe22-sprintmission-pandamarket.netlify.app/"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset-min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <script defer src="./src/index.js"></script>
  </head>
  <body>
    <header>
      <nav class="gnb">
        <h1 class="logo">
          <a href="/" alt="판다마켓">
            <img
              src="/images/logo/logo_only_text.svg"
              alt="판다마켓"
              class="logo-mo" />
            <img src="/images/logo/logo.svg" alt="판다마켓" class="logo-pc"
          /></a>
        </h1>
        <a href="/login.html" alt="로그인" class="btn blue btn_login">로그인</a>
      </nav>
    </header>
    <main>
      <!-- 상단 배너 영역 -->
      <section class="banner top">
        <div class="inner">
          <div class="info">
            <p class="text">일상의 모든 물건을 <br />거래해 보세요</p>
            <a href="/items.html" class="btn blue">구경하러 가기</a>
          </div>
          <div class="img-wrap">
            <img src="/images/main/Img_home_top.svg" alt="판다 이미지" />
          </div>
        </div>
      </section>
      <!-- 메인01 영역  -->
      <section class="main main01">
        <div class="inner">
          <img src="/images/main/Img_home_01.svg" alt="" />
          <div class="info">
            <span class="label">Hot item</span>
            <div class="title">인기 상품을 <br />확인해 보세요</div>
            <div class="description">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </div>
          </div>
        </div>
      </section>
      <!-- 메인02 영역  -->
      <section class="main main02">
        <div class="inner reverse">
          <img src="/images/main/Img_home_02.svg" alt="" />
          <div class="info">
            <span class="label">Search</span>
            <div class="title">구매를 원하는 <br />상품을 검색하세요</div>
            <div class="description">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </div>
          </div>
        </div>
      </section>
      <!-- 메인03 영역  -->
      <section class="main main03">
        <div class="inner">
          <img src="/images/main/Img_home_03.svg" alt="" />
          <div class="info">
            <span class="label">Register</span>
            <div class="title">판매를 원하는 <br />상품을 등록하세요</div>
            <div class="description">
              어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요
            </div>
          </div>
        </div>
      </section>
      <!-- 하단 배너 영역 -->
      <section class="banner bottom">
        <div class="inner">
          <div class="info">
            <p class="text">
              믿을 수 있는 <br />
              판다마켓 중고 거래
            </p>
          </div>
          <div class="img-wrap">
            <img src="/images/main/Img_home_bottom.svg" alt="판다 이미지" />
          </div>
        </div>
      </section>
    </main>
    <!-- 푸터 -->
    <footer>
      <div class="inner">
        <div class="copyright">©codeit - 2024</div>
        <ul class="footer_menu">
          <li>
            <a href="/privacy.html" class="privacy">Privacy Policy</a>
          </li>
          <li>
            <a href="/faq.html" class="faq">FAQ</a>
          </li>
        </ul>
        <ul class="sns-list">
          <!-- 페이스북 -->
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img src="/images/icon/ic_facebook.svg" alt="페이스북" />
            </a>
          </li>
          <!-- 트위터 -->
          <li>
            <a href="https://x.com/" target="_blank">
              <img src="/images/icon/ic_twitter.svg" alt="트위터" />
            </a>
          </li>
          <!-- 유튜브 -->
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="/images/icon/ic_youtube.svg" alt="유튜브" />
            </a>
          </li>
          <!-- 인스타 -->
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="/images/icon/ic_instagram.svg" alt="인스타" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
