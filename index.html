<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <link rel="stylesheet" href="./panda.css" />
    <title>판다마켓</title>
</head>
<body>
    <header>
    <div class="headerbox container"> 
        <div class="headerbox-left">
        <a href="/">
        <img src="./images/Property 1=lg.svg">
        </a>
        </div>
        <div class="headerbox-right">
        <button onclick="location.href='./login.html'">로그인</button>
        </div>
    </div>
    </header>


    <main>
        <section class="explore-section">
            <div class="explore-center container">
                <div class="explore-left">
                    <div class="explore-left-text">
                    일상의 모든물건을<br> 거래해 보세요
                    </div>
                    <button onclick="location.href='/items'">구경하러 가기</button>
                </div>
                <div class="explore-right"><img src="./images/Img_home_top.png"></div>
            </div>
          </section>

        <section class="item">
            <div class="item-check">
              <div class="item-check-center container">
                <div class="item-check-left"><img src="./images/Img_home_01.png"></div>
                <div class="item-check-right">
                  <p>Hot item</p>
                  <p>인기 상품을<br> 확인해 보세요</p>
                  <p>가장 HOT한 중고거래 물품을<br> 판다 마켓에서 확인해보세요</p>
                </div>
              </div>
            </div>
            <div class="item-search">
              <div class="item-search-center container">
                <div class="item-search-left">
                  <p>search</p>
                  <p>구매를 원하는<br>상품을 검색하세요</p>
                  <p>구매하고 싶은 물품은 검색해서<br> 쉽게 찾아보세요</p>
                </div>
                <div class="item-search-right"><img src="./images/Img_home_02.png"></div>
              </div>
            </div>
            <div class="item-register">
              <div class="item-register-center container">
                <div class="item-register-left">
                  <img src="./images/Img_home_03.png">
                </div>
                <div class="item-register-right">
                  <p>search</p>
                  <p>판매를 원하는<br> 상품을 등록하세요</p>
                  <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
                </div>
              </div>
            </div>
        </section>


        <section class="panda">
          <div class="panda-center container">
            <div class="panda-left">
              <p>믿을 수 있는<br>판다마켓 중고 거래</p>
            </div>
            <div class="panda-right">
              <img src="./images/Img_home_bottom.png">
            </div>
          </div>
        </section>
        
    </main>
      
    <footer>
      <div class="footer-center container">
        <div class="fc-left">
          <p>©codeit - 2024</p>
        </div>
        <div class="fc-center">
          <p>Privacy policy</p>
          <p>FAQ</p>
        </div>
        <div class="fc-right">
          <a href="https://www.facebook.com/" target="_blank">
             <img src="./icon/ic_facebook.png">
          </a>

          <a href="https://x.com/?lang=ko" target="_blank">
            <img src="./icon/ic_twitter.png">
         </a>

          <a href="https://www.youtube.com/" target="_blank">
           <img src="./icon/ic_youtube.png">
          </a>

          <a href="https://www.instagram.com/" target="_blank">
            <img src="./icon/ic_instagram.png">
          </a>

        </div>
      </div>
    </footer>
</body>
</html>
