<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>판다마켓</title>
        <link rel="stylesheet" href="/css/reset.css" />
        <link rel="stylesheet" href="/css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet" as="style" crossorigin />
    </head>
    <body>
        <header class="header">
            <nav class="inner">
                <a href="/" class="logo"><img src="/img/logo.png" alt="판다마켓" /></a>
                <a href="login.html" class="login-btn">로그인</a>
            </nav>
        </header>
        <section class="visual">
            <div class="visual-container inner">
                <div class="visual-content">
                    <h1>일상의 모든 물건을<br />거래해 보세요</h1>
                    <a href="/items.html" class="visual-btn">구경하러 가기</a>
                </div>
                <div class="visual-image">
                    <img src="/img/Img_home_top.png" alt="판다마켓 캐릭터" />
                </div>
            </div>
        </section>
        <main class="feature-container">
            <!-- 섹션 1: 인기 상품 -->
            <section class="feature">  
                <div class="inner">
                    <div class="feature__image-box img-reset">
                        <img src="/img/Img_home_01.png" alt="대시보드에 표시된 인기 상품 목록" class="feature__image" />
                    </div>
                    <div class="feature__text-box">
                        <strong class="feature__tag">Hot item</strong>
                        <h2 class="feature__title">인기 상품을<br />확인해 보세요</h2>
                        <p class="feature__description">가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
                    </div>
                </div>          

            </section>

            <!-- 섹션 2: 검색 (이미지가 우측으로 가는 구조) -->
            <section class="feature feature--reverse">            
                <div class="inner">
                    <div class="feature__text-box">
                        <strong class="feature__tag">Search</strong>
                        <h2 class="feature__title">구매를 원하는<br />상품을 검색하세요</h2>
                        <p class="feature__description">구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
                    </div>
                    <div class="feature__image-box img-reset">
                        <img src="/img/Img_home_02.png" alt="대시보드에 표시된 인기 상품 목록" class="feature__image" />
                    </div>
                </div>
            </section>

            <!-- 섹션 3: 상품 등록 -->
            <section class="feature">
                <div class="inner">           
                    <div class="feature__image-box img-reset">
                        <img src="/img/Img_home_03.png" alt="대시보드에 표시된 인기 상품 목록" class="feature__image" />
                    </div>
                    <div class="feature__text-box">
                        <strong class="feature__tag">Register</strong>
                        <h2 class="feature__title">판매를 원하는<br />상품을 등록하세요</h2>
                        <p class="feature__description">어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
                    </div>
                </div>
            </section>
        </main>

        <section class="visual bottom">
            <div class="visual-container inner">
                <div class="visual-content">
                    <h1>일상의 모든 물건을<br />거래해 보세요</h1>
                </div>
                <div class="visual-image">
                    <img src="/img/Img_home_bottom.png" alt="판다마켓 캐릭터" />
                </div>
            </div>
        </section>
        <footer class="footer">
            <ul class="footer-ul">
                <li><small>@codeit - 2024</small></li>
                <li><a href="/privacy">Privacy Policy</a> <a href="/faq">FAQ</a></li>
                <li>
                    <ul class="icon">
                        <li>
                            <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                        </li>
                        <li>
                            <a href="https://www.twitter.com/" target="_blank" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                        </li>
                        <li>
                            <a href="https://www.youtube.com/" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                        </li>
                        <li>
                            <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                        </li>
                    </ul>
                </li>
            </ul>
        </footer>
    </body>
</html>
