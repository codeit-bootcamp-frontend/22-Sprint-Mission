<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/index.css">
  <title>판다마켓</title>
</head>
<body>
  <header class="header">
    <nav class="header-inner">
      <a href="/">
        <img class="header-logo" src="assets/img/logo.png" alt="판다마켓 로고">
      </a>
      <a class="button login-btn" href="login.html">로그인</a>
    </nav>
  </header>
  <main class="main">
    <section class="banner">
      <div class="banner-inner">
        <div class="banner-content-top">
          <h2 class="banner-title">
            일상의 모든 물건을<br>
            거래해 보세요
          </h2>
          <a class="button go-btn" href="items.html">구경하러 가기</a>
        </div>
        <img class="banner-img-top" src="assets/img/img_home_top.png" alt="위쪽 배너 사진">
      </div>
    </section>
    <section class="features">
      <div class="feature-inner">
        <div class="feature-card">
          <img class="feature-img" src="assets/img/img_home_01.png" alt="인기 상품">
          <div class="feature-content">
            <span class="feature-label">Hot item</span>
            <h2 class="feature-title">
              인기 상품을<br>
              확인해 보세요
            </h2>
            <p class="feature-description">
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>
      <div class="feature-inner">
        <div class="feature-card">
          <div class="feature-content feature-content-right">
            <span class="feature-label">Search</span>
            <h2 class="feature-title">
              구매를 원하는<br>
              상품을 검색하세요
            </h2>
            <p class="feature-description">
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
            </p>
          </div>
          <img class="feature-img" src="assets/img/img_home_02.png" alt="상품 검색">
        </div>
      </div>
      <div class="feature-inner">
        <div class="feature-card">
          <img class="feature-img" src="assets/img/img_home_03.png" alt="상품 등록">
          <div class="feature-content">
            <span class="feature-label">Register</span>
            <h2 class="feature-title">
              판매를 원하는<br>
              상품을 등록하세요
            </h2>
            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </section>
    <section class="banner">
      <div class="banner-inner">
        <div class="banner-content-bottom">
          <h2 class="banner-title">
            믿을 수 있는<br>
            판다마켓 중고 거래
          </h2>
        </div>
        <img class="banner-img-bottom" src="assets/img/img_home_bottom.png" alt="아래쪽 배너 사진">
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-copyright">©codeit - 2024</span>
      <div class="footer-links">
        <a class="footer-link" href="privacy.html">Privacy Policy</a>
        <a class="footer-link" href="faq.html">FAQ</a>
      </div>
      <div class="footer-icons">
        <a href="https://www.facebook.com">
          <img class="footer-icon" src="assets/img/ic_facebook.svg" alt="페이스북 아이콘">
        </a>
        <a href="https://x.com/">
          <img class="footer-icon" src="assets/img/ic_twitter.svg" alt="트위터 아이콘">
        </a>
        <a href="https://www.youtube.com/">
          <img class="footer-icon" src="assets/img/ic_youtube.svg" alt="유튜브 아이콘">
        </a>
        <a href="https://www.instagram.com/">
          <img class="footer-icon" src="assets/img/ic_instagram.svg" alt="인스타 아이콘">
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
