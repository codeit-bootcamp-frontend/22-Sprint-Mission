<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>

    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/signup.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>

  <body>
    <h1 class="sr-only">회원가입 페이지</h1>

    <div class="auth-container">
      <a class="home-link" href="../pages/index.html">
        <img class="logo" src="../images/logo2.svg" alt="판다마켓 로고" />
      </a>

      <form class="auth-form" action="login.html">
        <div class="input-field">
          <label for="email">이메일</label>
          <input type="email" id="email" />
        </div>

        <div class="input-field">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" />
        </div>

        <div class="input-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" />
        </div>

        <div class="input-field">
          <label for="password-confirm">비밀번호 확인</label>
          <input type="password" id="password-confirm" />
        </div>

        <button type="submit" class="auth-form-button">회원가입</button>
        <p class="auth-helper-text">
          이미 계정이 있으신가요?
          <a href="login.html">로그인</a>
        </p>
      </form>
    </div>
  </body>
</html>
