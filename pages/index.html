<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable.css"
    />
  </head>
  <body>
    <header class="gnb">
      <div class="gnb-inner">
        <h1 class="logo">
            <img src="../images/logo.svg" alt="판다마켓 로고" />
        </h1>
        <a href="login.html" class="login-btn">로그인</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-text">
            <h2>
              일상의 모든 물건을<br />
              거래해 보세요
            </h2>
            <a href="/items" class="hero-btn">구경하러 가기</a>
          </div>
          <img src="../images/img_home_top.png" alt="" class="hero-image" />
        </div>
      </section>

      <section class="section hot">
        <div class="card">
          <div class="card-inner">
            <img src="../images/Img_home_01.png" alt="" class="card-image" />
            <div class="card-text">
              <span class="card-label">Hot item</span>
              <div class="card-content">
                <h2 class="card-title">
                  인기 상품을<br />확인해 보세요
                </h2>
                <p class="card-desc">
                  가장 HOT한 중고거래 물품을<br />
                  판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section search">
        <div class="card">
          <div class="card-inner">
            <div class="card-text">
              <span class="card-label">Search</span>
              <div class="card-content">
                <h2 class="card-title">
                  구매를 원하는<br />상품을 검색하세요
                </h2>
                <p class="card-desc">
                  구매하고 싶은 물품은 검색해서<br />
                  쉽게 찾아보세요
                </p>
              </div>
            </div>
            <img src="../images/Img_home_02.png" alt="" class="card-image" />
          </div>
        </div>
      </section>

      <section class="section register">
        <div class="card">
          <div class="card-inner">
            <img src="../images/Img_home_03.png" alt="" class="card-image" />
            <div class="card-text">
              <span class="card-label">Register</span>
              <div class="card-content">
                <h2 class="card-title">
                  판매를 원하는<br />상품을 등록하세요
                </h2>
                <p class="card-desc">
                  어떤 물건이든 판매하고 싶은 상품을<br />
                  쉽게 등록하세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="bottom-section">
        <div class="bottom-inner">
          <div class="bottom-text">
            믿을 수 있는<br />
            판다마켓 중고 거래
          </div>
          <img src="../images/Img_home_bottom.png" alt="" class="bottom-image" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner"></div>
    </footer>
  </body>
</html>
