<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>

    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <h1 class="sr-only">로그인 페이지</h1>

    <div class="auth-container">
      <h2 class="logo">
        <a href="index.html">
          <img src="../images/logo.svg" alt="판다마켓 로고" />
          <span class="logo-text">판다마켓</span>
        </a>
      </h2>

      <form class="auth-form" action="index.html">
        <div class="input-field">
          <label for="email">이메일</label>
          <input type="email" id="email" />
        </div>

        <div class="input-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" />
        </div>

        <button type="submit" class="auth-form-button">로그인</button>

        <p class="auth-helper-text">
          판다마켓이 처음이신가요?
          <a href="signup.html">회원가입</a>
        </p>
      </form>
    </div>
  </body>
</html>
