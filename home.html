<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav">
            <a href="home.html" class="logo">
                <img src="./images/PandaFace.png" alt="판다마켓 로고">
                <span>판다마켓</span>
            </a>
            <a href="#" class="login-btn">로그인</a>
        </div>
    </nav>

    <main>
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-text">
                    <p>일상의 모든 물건을<br>거래해 보세요</p>
                    <a href="#" class="cta-btn">구경하러 가기</a>
                </div>
                <div class="hero-image">
                    <img src="./images/Img_home_top.png" alt="판다마켓 메인 이미지">
                </div>
            </div>
        </section>

        <section class="feature-item-section">
            <div class="feature-content">
                <div class="feature-image">
                    <img src="./images/Img_home_01.png" alt="Hot Item">
                </div>
                <div class="feature-text">
                    <span class="label">Hot item</span>
                    <div class="feature-title">인기 상품을<br>확인해 보세요</div>
                    <div class="feature-description">가장 HOT한 중고거래 물품을<br>판다마켓에서 확인해 보세요</div>
                </div>
            </div>
        </section>

        <section class="feature-item-section">
            <div class="feature-content reverse">
                <div class="feature-image">
                    <img src="./images/Img_home_02.png" alt="Search">
                </div>
                <div class="feature-text">
                    <span class="label">Search</span>
                    <div class="feature-title">구매를 원하는<br>상품을 검색하세요</div>
                    <div class="feature-description">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</div>
                </div>
            </div>
        </section>

        <section class="feature-item-section">
            <div class="feature-content">
                <div class="feature-image">
                    <img src="./images/Img_home_03.png" alt="Register">
                </div>
                <div class="feature-text">
                    <span class="label">Register</span>
                    <div class="feature-title">판매를 원하는<br>상품을 등록하세요</div>
                    <div class="feature-description">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</div>
                </div>
            </div>
        </section>

        <section class="bottom-section">
            <div class="bottom-content">
                <div class="bottom-content-text">
                    <p>믿을 수 있는<br>판다마켓 중고 거래</p>
                </div>
                <div class="bottom-image">
                    <img src="./images/Img_home_bottom.png" alt="판다마켓 신뢰 이미지">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer">
            <div class="footer-copyright">©codeit - 2024</div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">FAQ</a>
            </div>
            <div class="footer-social">
                <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/ic_facebook.png" alt="Facebook">
                </a>
                <a href="https://www.twitter.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/ic_twitter.png" alt="Twitter">
                </a>
                <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/ic_youtube.png" alt="YouTube">
                </a>
                <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                    <img src="./images/ic_instagram.png" alt="Instagram">
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
