<!Doctype html>
<html lang="ko">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>판다마켓</title>
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="main.css" /> 
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <nav class="nav-bar">  
      <a class="logo-btn" href="main.html">
        <img src="logo.png" alt="판다마켓 로고" aria-hidden="true" />
      </a>
      <a class="login-btn" href="login.html">로그인</a>
    </nav>
  </header>
  <section class="top-wrapper">
      <div class="top">
        <div class="top-content">
        <h1>
          일상의 모든 물건을 <br>
          거래해보세요
        </h1>
        <a class="market-btn" href="items.html">구경하러 가기</a>
        </div>
        <div class="top-img">
        <img src="img_home_top.png" alt="장바구니를 들고 있는 판다" />
        </div>
    </div>
  </section>

  <section class="features">

    <div class="feature-container">
      <div class="feature">
        <div>
          <img src="Img_home_01.png" alt="인기 상품" />
        </div>
        <div class="feature-content hot-item">
          <span>Hot item</span>
          <h2>
            인기 상품을<br>
            확인해 보세요
          </h2>
          <p>
            가장 HOT한 중고거래 물품을<br>
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </div>

        <div class="feature-container">
      <div class="feature flex-row-reverse">
        <div>
          <img src="Img_home_02.png" alt="상품 검색" />
        </div>
        <div class="feature-content search">
          <span>Search</span>
          <h2>
            구매를 원하는<br>
            상품을 검색하세요
          </h2>
          <p>
            구매하고 싶은 물품을 검색해서<br>
            쉽게 찾아보세요
          </p>
        </div>
      </div>
    </div>

        <div class="feature-container">
      <div class="feature">
        <div>
          <img src="Img_home_03.png" alt="상품 등록" />
        </div>
        <div class="feature-content register">
          <span>Register</span>
          <h2>
            판매를 원하는<br>
            상품을 등록하세요
          </h2>
          <p>
            어떤 물건이든 판매하고 싶은 상품을<br>
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="bottom-wrapper">
      <div class="bottom">
        <div class="bottom-content">
        <h1>
          일상의 모든 물건을 <br>
          거래해보세요
        </h1>
        </div>
        <div class="bottom-img">
        <img src="Img_home_bottom.png" alt="장바구니를 들고 인사하는 두마리 판다" />
        </div>
    </div>
  </section>
</body>
</html>
